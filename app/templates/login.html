{% extends "base.html" %}
{% block title %}{{ _('Anmelden') }} – Gutscheinkontor{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ _('Anmelden') }}</h1>
  {% if notice %}<p class="alert alert-info" role="status">{{ notice }}</p>{% endif %}
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>{{ _('E-Mail') }}
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username" autofocus>
    </label>
    <label>{{ _('Passwort') }}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">{{ _('Anmelden') }}</button>
  </form>
  <p><a href="/password-reset">{{ _('Passwort vergessen?') }}</a></p>
</section>
<img class="login-logo" src="/static/login-logo.webp" width="320" height="320" alt="Gutscheinkontor – {{ _('Deine Gutscheinverwaltung') }}">
{% endblock %}
