name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Startet das echte Image so, wie es ein Betreiber mit docker-compose.yml tut, und prüft es durch.
  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gutscheinkontor:ci
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}

      - name: Konfiguration schreiben
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -base64 48)"
            echo "BASE_URL=http://127.0.0.1:8000"
            echo "FORWARDED_ALLOW_IPS=172.16.0.0/12"
            echo "BACKUP_HOUR=0"
            echo "GK_IMAGE=gutscheinkontor:ci"
          } > .env

      - name: Container starten (wartet auf den Health-Check)
        run: docker compose up -d --wait --wait-timeout 120

      - name: Rauchtest über HTTP
        run: python scripts/smoke_test.py http://127.0.0.1:8000

      - name: Härtung prüfen (kein Root, schreibgeschütztes Dateisystem)
        run: |
          test "$(docker compose exec -T gutscheinkontor id -u)" = "10001"
          if docker compose exec -T gutscheinkontor sh -c 'touch /srv/schreibtest' 2>/dev/null; then
            echo "FEHLER: Das Dateisystem des Containers ist nicht schreibgeschützt"; exit 1
          fi
          docker compose exec -T gutscheinkontor sh -c 'touch /data/ok && rm /data/ok'
          docker compose exec -T gutscheinkontor python -m app.cli backup

      - name: Daten überstehen einen Neustart
        run: |
          docker compose restart -t 30
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8000/health
          users=$(docker compose exec -T gutscheinkontor python -c "import sqlite3; print(sqlite3.connect('/data/gutscheinkontor.db').execute('select count(*) from users').fetchone()[0])")
          test "$users" = "1"

      - name: Sauberes und schnelles Beenden
        run: |
          start=$(date +%s)
          docker compose stop -t 30
          elapsed=$(( $(date +%s) - start ))
          echo "Beenden dauerte ${elapsed}s"
          # Ohne SIGTERM-Weitergabe würde Docker nach 10 s hart beenden.
          test "$elapsed" -le 8

      - name: Log prüfen (keine Tokens, keine Fehler)
        run: |
          docker compose logs --no-color > container.log
          cat container.log
          ! grep -q "SMOKETOKEN" container.log
          ! grep -qi "traceback" container.log
          grep -q "Backup erstellt" container.log

      - name: Log bei Fehlern ausgeben
        if: failure()
        run: docker compose logs --no-color || true

      - name: Aufräumen
        if: always()
        run: docker compose down -v || true

  # Baut das Image zusätzlich für ARM (Raspberry Pi). Gestartet wird es nur unter amd64.
  docker-multiarch:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
