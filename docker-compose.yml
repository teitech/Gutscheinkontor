# Privates Projekt (Vibe-Coding), Nutzung auf eigene Gefahr.
# Start: cp .env.example .env, SECRET_KEY und BASE_URL eintragen, dann: docker compose up -d
services:
  gutscheinkontor:
    image: ${GK_IMAGE:-ghcr.io/teitech/gutscheinkontor:latest}
    container_name: gutscheinkontor
    restart: unless-stopped
    env_file: .env
    volumes:
      - gutscheinkontor-data:/data
    ports:
      # Nur lokal erreichbar. Läuft dein Reverse Proxy auf einem anderen Rechner: siehe README.
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  gutscheinkontor-data:
    name: gutscheinkontor-data
